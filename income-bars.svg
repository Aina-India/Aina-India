<svg width="820" height="272" viewBox="0 0 820 272" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      }
      .label-main { font-size: 13px; fill: #c9d1d9; }
      .label-sub  { font-size: 11px; fill: #6e7681; }
      .pct        { font-size: 14px; font-weight: 700; }
      .title      { font-size: 11.5px; fill: #8b949e; }
      .source     { font-size: 10px;   fill: #484f58; }
      .callout    { font-size: 11px;   fill: #6e7681; }
      .highlight-label { font-size: 13px; fill: #ffa657; font-weight: 600; }
      .highlight-sub   { font-size: 11px; fill: #e8650a; }
    </style>
    <!-- Bar gradients -->
    <linearGradient id="g-low" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="g-mid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1158c7"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="g-high" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9e6a03"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
    <linearGradient id="g-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b73a1e"/>
      <stop offset="100%" stop-color="#e8650a"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="820" height="272" rx="8" fill="#161b22"/>
  <rect x="1" y="1" width="818" height="270" rx="7" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="24" y="30" class="title">
    WHO EARNS WHAT — INDIA 2022–23 · WORLD INEQUALITY LAB (wid.world/country/india)
  </text>

  <!-- ── Row 1: Bottom 50% ── -->
  <text x="24"  y="60" class="label-main">500M people</text>
  <text x="154" y="60" class="label-sub">bottom 50%</text>
  <!-- Track -->
  <rect x="270" y="46" width="464" height="22" rx="4" fill="#21262d"/>
  <!-- Bar: 15% → 464 × 0.15 = 69.6 -->
  <rect x="270" y="46" width="70" height="22" rx="4" fill="url(#g-low)"/>
  <!-- % label -->
  <text x="348" y="62" class="pct" fill="#3fb950">15%</text>
  <text x="508" y="60" class="label-sub">of national income</text>

  <!-- ── Row 2: Middle 40% ── -->
  <text x="24"  y="100" class="label-main">400M people</text>
  <text x="154" y="100" class="label-sub">middle 40%</text>
  <rect x="270" y="86" width="464" height="22" rx="4" fill="#21262d"/>
  <!-- 27% → 125.3 -->
  <rect x="270" y="86" width="125" height="22" rx="4" fill="url(#g-mid)"/>
  <text x="403" y="102" class="pct" fill="#388bfd">27%</text>
  <text x="508" y="100" class="label-sub">of national income</text>

  <!-- ── Row 3: Top 10% ── -->
  <text x="24"  y="140" class="label-main">90M people</text>
  <text x="154" y="140" class="label-sub">top 10%</text>
  <rect x="270" y="126" width="464" height="22" rx="4" fill="#21262d"/>
  <!-- 57% → 264.5 -->
  <rect x="270" y="126" width="265" height="22" rx="4" fill="url(#g-high)"/>
  <text x="543" y="142" class="pct" fill="#d29922">57%</text>
  <text x="572" y="140" class="label-sub">of national income</text>

  <!-- Separator -->
  <line x1="24" y1="161" x2="796" y2="161" stroke="#30363d" stroke-dasharray="5 4"/>

  <!-- ── Row 4: Top 1% — highlighted ── -->
  <rect x="8" y="165" width="804" height="60" rx="4" fill="#1a0e06"/>
  <text x="24"  y="192" class="highlight-label">10M people</text>
  <text x="154" y="192" class="highlight-sub">top 1% only →</text>
  <rect x="270" y="178" width="464" height="22" rx="4" fill="#2d1a0a"/>
  <!-- 22% → 102.1 -->
  <rect x="270" y="178" width="102" height="22" rx="4" fill="url(#g-top)"/>
  <text x="380" y="194" class="pct" fill="#e8650a">22%</text>
  <text x="420" y="192" class="highlight-sub">of national income</text>

  <!-- Callout -->
  <text x="270" y="218" class="callout">
    └─ 10 million people, out-earning 500 million combined
  </text>

  <!-- Source -->
  <text x="24" y="256" class="source">
    Source: Chancel, Piketty, Bharti (2024) — India Income and Wealth Inequality 1922–2023 · wid.world
  </text>
</svg>
